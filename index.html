<!doctype html><html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.webmanifest">
<title>FATL LastZ Ops</title>
<style>
:root{--tw:120px;--cw:58px;--rh:39px}
*{box-sizing:border-box}
html,body{margin:0;background:#0d0f12;color:#f4f5f7;font-family:Arial,sans-serif;height:100%}
body{overflow:hidden}
.top{height:48px;display:flex;align-items:center;gap:6px;padding:5px 7px;background:#15181d;border-bottom:1px solid #40464f}
.brand{font-weight:900;font-size:14px}.brand b{color:#ef3b22}.sub{font-size:8px;color:#9fa7b1}.sp{flex:1}
.btn{background:#252a31;color:#fff;border:1px solid #555d68;border-radius:6px;padding:6px 8px;font-weight:800;font-size:10px}
.danger{background:#7c2018}
.wrap{height:calc(100vh - 48px);overflow:auto}
table{border-collapse:separate;border-spacing:0;min-width:calc(var(--tw) + (7 * var(--cw)));width:max-content;table-layout:fixed}
th,td{height:var(--rh);border-right:1px solid #303640;border-bottom:1px solid #303640;text-align:center;background:#0f1114;padding:0}
thead th{height:38px;background:#22262c;position:sticky;top:0;z-index:4;font-size:10px}
.task{position:sticky;left:0;z-index:3;width:var(--tw);min-width:var(--tw);max-width:var(--tw);text-align:left;padding:0 6px;background:#151a1d;font-weight:800;font-size:11px;white-space:nowrap;overflow:hidden;border-right:3px solid #aab4c0}
thead .task{z-index:7}
.acct,.skip{width:var(--cw);min-width:var(--cw);max-width:var(--cw)}
input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:#e9ecef}
input[type=checkbox]:disabled{opacity:.55}
.section td{height:26px;background:#2a1715;color:#ff745f;font-weight:900;letter-spacing:.8px;text-align:left;padding-left:7px;font-size:10px}
.section .task{background:#2a1715;color:#ff745f}
.grip{position:fixed;left:108px;top:53px;z-index:20;width:18px;height:30px;background:#66707b;border-radius:8px;touch-action:none}
.grip:after{content:"↔";display:block;text-align:center;line-height:30px;font-size:12px}
.splash{position:fixed;inset:0;background:#050505;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;transition:.25s}
.splash.hide{opacity:0;pointer-events:none}
.fatl{font-size:58px;font-weight:1000;letter-spacing:-5px}.fatl span{color:#ef321b}
.splash h2{margin:3px;color:#ef321b;letter-spacing:2px;font-size:12px}.splash p{color:#bbb;letter-spacing:1.5px;font-size:9px}
</style></head><body>
<div id="splash" class="splash"><div class="fatl">FAT<span>L</span></div><h2>FATAL ASSAULT TACTICAL LEGION</h2><p>FAMILY ALWAYS TOGETHER LEGENDARY</p></div>
<header class="top"><div><div class="brand"><b>FATL</b> • LAST Z OPS</div><div class="sub">Fortune Accumulates Through Logistics</div></div><div class="sp"></div><span id="status" class="sub">SAVED</span><button id="backup" class="btn">BACKUP</button><button id="newday" class="btn danger">NEW DAY</button></header>
<div id="grip" class="grip"></div>
<div class="wrap"><table><thead><tr><th class="task">TASK</th><th class="acct">MAIN</th><th class="acct">F1</th><th class="acct">F2</th><th class="acct">F3</th><th class="acct">F4</th><th class="acct">F5</th><th class="skip">SKIP</th></tr></thead><tbody id="body"></tbody></table></div>
<script>
const GENERAL=["Alliance Tech", "Area Exploration", "Arena", "Battlefield Breakout", "Black Market", "Boomer Auto-Join ON", "Boomers", "Bounties (Personal)", "Bounties (Plunder)", "FarmLand", "FP: Tech", "FP: Tank", "FP: Hero", "FP: Shelter", "FP: Army", "FuryLord", "Hero Battlefield", "Hero Initiative", "Hospital", "Idle Rewards", "Intercity Trucks Looted", "Intercity Trucks Sent 3", "Intercity Trucks Sent 4", "LumberYard", "Mines Melee 123", "Mines Melee 4", "Prime Recruits", "Radar", "Recruit Refugees", "Research", "Saga", "Store Check-In", "Treasure Of The Day", "VIP Freebies", "Freebies", "Duel", "Tyrant ON", "Builder"],SEASON=["Dino Rescue", "Egg Lab", "Dino Feed", "Ferns", "Badges", "Buildings"],ACCTS=["Main","Farm1","Farm2","Farm3","Farm4","Farm5"],KEY="fatl-lastz-ops-v4";
let state={checks:{},taskw:120};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch(e){}
const d=()=>new Date().getDay();
function hidden(t){let x=d();return(t==="FP: Tech"&&x!==3)||((t==="Saga"||t==="Battlefield Breakout")&&!(x===0||x===6))||(t==="Radar"&&x!==1)}
function forced(t,a){return a==="Farm4"||a==="Farm5"||(t==="Treasure Of The Day"&&a!=="Main")||hidden(t)}
const k=(t,a)=>t+"|"+a;
function save(){localStorage.setItem(KEY,JSON.stringify(state));status.textContent="SAVED"}
function render(){
 document.documentElement.style.setProperty("--tw",state.taskw+"px");body.innerHTML="";
 function sec(name,arr){
  let s=document.createElement("tr");s.className="section";s.innerHTML=`<td class="task">${name}</td><td colspan="7">${name}</td>`;body.appendChild(s);
  arr.forEach(t=>{
   if(hidden(t))return;
   let r=document.createElement("tr"),h=`<td class="task">${t}</td>`;
   ACCTS.forEach(a=>{let f=forced(t,a),c=f||!!state.checks[k(t,a)];h+=`<td><input type="checkbox" data-t="${t}" data-a="${a}" ${c?"checked":""} ${f?"disabled":""}></td>`});
   h+=`<td><input class="sk" type="checkbox" data-t="${t}"></td>`;r.innerHTML=h;body.appendChild(r);
  })
 }
 sec("GENERAL",GENERAL);sec("SEASON TASKS",SEASON);
 document.querySelectorAll('input:not(.sk)').forEach(x=>x.onchange=()=>{state.checks[k(x.dataset.t,x.dataset.a)]=x.checked;save()});
 document.querySelectorAll('.sk').forEach(x=>x.onchange=()=>{ACCTS.forEach(a=>state.checks[k(x.dataset.t,a)]=x.checked);save();render()})
}
newday.onclick=()=>{if(confirm("Start a NEW DAY? This clears today's checkmarks.")){state.checks={};save();render()}};
backup.onclick=()=>{let b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="LastZ_Ops_Backup.json";a.click()};
let drag=false;
grip.onpointerdown=e=>{drag=true;grip.setPointerCapture(e.pointerId)};
grip.onpointermove=e=>{if(!drag)return;state.taskw=Math.max(62,Math.min(240,e.clientX));document.documentElement.style.setProperty("--tw",state.taskw+"px");grip.style.left=(state.taskw-9)+"px"};
grip.onpointerup=()=>{drag=false;save()};
render();grip.style.left=(state.taskw-9)+"px";
setTimeout(()=>splash.classList.add("hide"),650);
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
